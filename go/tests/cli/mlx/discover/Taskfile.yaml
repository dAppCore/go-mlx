version: "3"

# AX-10 CLI artifact test: `lthn-mlx discover -json` — the machine/device
# capability report (Metal device, cache modes, capabilities, workloads). No
# model load (device probe only), so it's a fast surface test of the discover
# command + its JSON contract. jq-asserted, no python.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        bin="$(build_mlx "$root")"
        export MLX_METALLIB_PATH="$(metallib_path "$root")"
        out="$(mktemp)"
        run_capture_stdout 0 "$out" "$bin" discover -json
        assert_jq '.device and .capabilities and .cache_modes and .workloads' "$out" || {
          echo "FAIL: discover -json missing expected report fields" >&2; cat "$out" >&2; exit 1; }
        echo "PASS: discover -json — device + capabilities + cache_modes + workloads reported"
        EOF
