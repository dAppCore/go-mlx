version: "3"

# AX-10 CLI artifact test: `lthn-mlx tune` — measures AR vs MTP draft blocks on a
# real model and persists the winning profile. Capped to one block + a short run
# (default sweeps 4,5,6 x 256 tok) so it's a fast happy-path; profile-dir is a
# temp so it doesn't touch ~/Lethean. Isolated process, one model load. No python.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        model="$(hf_model_path mlx-community/gemma-4-e2b-it-4bit)" || { echo "SKIP: e2b-4bit not cached"; exit 0; }
        # tune needs an MTP drafter to measure AR vs MTP; the e2b assistant isn't
        # beside the target in the cache, so pass it explicitly.
        draft="$(hf_model_path mlx-community/gemma-4-E2B-it-assistant-bf16)" || { echo "SKIP: e2b assistant drafter not cached"; exit 0; }
        bin="$(build_mlx "$root")"
        export MLX_METALLIB_PATH="$(metallib_path "$root")"
        out="$(mktemp)"
        run_capture_all 0 "$out" "$bin" tune --model "$model" -draft "$draft" -depths 5 -max-tokens 24 -profile-dir "$(mktemp -d)"
        grep -qiE 'selected|candidate' "$out" || { echo "FAIL: tune produced no AR-vs-MTP measurement" >&2; cat "$out" >&2; exit 1; }
        echo "PASS: tune measured AR vs MTP — $(grep -oiE 'selected:.*' "$out" | head -1 | head -c 70)"
        EOF
