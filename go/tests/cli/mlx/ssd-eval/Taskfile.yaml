version: "3"

# AX-10 CLI artifact test: `lthn-mlx ssd-eval` — prepares a Simple Self-Distil
# eval plan. Needs a -samples jsonl to run a real plan; here a usage-contract
# test (the command is wired + advertises its required -samples flag). -h exit
# code varies across the CLI (some 0, some 2) so the assert is exit-agnostic on
# the usage text, not the code. No python.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        bin="$(build_mlx "$root")"
        out="$(mktemp)"
        "$bin" ssd-eval -h >"$out" 2>&1 || true
        assert_contains "Usage:" "$out" || { echo "FAIL: ssd-eval -h no usage" >&2; cat "$out" >&2; exit 1; }
        assert_contains "ssd-eval" "$out"
        assert_contains "-samples" "$out"
        echo "PASS: ssd-eval wired + advertises its -samples contract"
        EOF
