version: "3"

# AX-10 CLI artifact test: `lthn-mlx vision` — the vision tower answering about a
# real image (the repo's own app-icon PNG — no synth needed) on e2b-4bit. A real
# instruction (not a bare turn) so gemma4 doesn't immediate-EOS. Isolated process,
# one model load. Asserts a non-trivial described answer. No python.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        model="$(hf_model_path mlx-community/gemma-4-e2b-it-4bit)" || { echo "SKIP: e2b-4bit not cached"; exit 0; }
        img="$root/cmd/mlx/assets/app-icon.png"
        [ -f "$img" ] || { echo "SKIP: no test image at $img"; exit 0; }
        bin="$(build_mlx "$root")"
        export MLX_METALLIB_PATH="$(metallib_path "$root")"
        out="$(mktemp)"
        run_capture_all 0 "$out" "$bin" vision -images "$img" -prompt "Describe this image in one short sentence." -max-tokens 40 "$model"
        [ "$(wc -c <"$out")" -gt 20 ] || { echo "FAIL: vision answer too short (tower may not have run)" >&2; cat "$out" >&2; exit 1; }
        echo "PASS: vision described the image — \"$(head -1 "$out" | head -c 70)\""
        EOF
