version: "3"

# AX-10 CLI artifact test: `lthn-mlx slice <model-path>` — materialises a local
# model slice for split/reload tests. Materialising a real slice writes a model
# tree; here a usage-contract test (wired + advertises the <model-path> arg),
# exit-agnostic on the usage text. No python.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        bin="$(build_mlx "$root")"
        out="$(mktemp)"
        "$bin" slice -h >"$out" 2>&1 || true
        assert_contains "Usage:" "$out" || { echo "FAIL: slice -h no usage" >&2; cat "$out" >&2; exit 1; }
        assert_contains "slice" "$out"
        assert_contains "model-path" "$out"
        echo "PASS: slice wired + advertises its <model-path> contract"
        EOF
