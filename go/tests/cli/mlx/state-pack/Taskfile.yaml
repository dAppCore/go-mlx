version: "3"

# AX-10 CLI artifact test: `lthn-mlx state-pack` — packs a State marker + binary
# log into a Trix .kv container (no model). Usage-contract test: wired +
# advertises its -marker-file/-output flags. Exit-agnostic on the usage text.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        bin="$(build_mlx "$root")"
        out="$(mktemp)"
        "$bin" state-pack -h >"$out" 2>&1 || true
        assert_contains "Usage:" "$out" || { echo "FAIL: state-pack -h no usage" >&2; cat "$out" >&2; exit 1; }
        assert_contains "state-pack" "$out"
        assert_contains "-marker-file" "$out"
        echo "PASS: state-pack wired + advertises its -marker-file/-output contract"
        EOF
