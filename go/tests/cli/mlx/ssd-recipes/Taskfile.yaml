version: "3"

# AX-10 CLI artifact test: `lthn-mlx ssd-recipes -json` — the LEK self-distil
# recipe catalogue. No model load. jq-asserts the report contract (recipes list
# non-empty + version + the no_python flag). No python.
tasks:
  test:
    cmds:
      - |
        bash <<'EOF'
        set -euo pipefail
        source ../_lib/run.sh
        root="$(go_root .)"
        bin="$(build_mlx "$root")"
        out="$(mktemp)"
        run_capture_stdout 0 "$out" "$bin" ssd-recipes -json
        assert_jq '.recipes and .version and (.recipes|length>0)' "$out" || {
          echo "FAIL: ssd-recipes -json missing recipes/version" >&2; cat "$out" >&2; exit 1; }
        echo "PASS: ssd-recipes -json — $(jq -r '.recipes|length' "$out") recipes, version $(jq -r '.version' "$out")"
        EOF
