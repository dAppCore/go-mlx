version: "3"

tasks:
  build:
    dir: ../../..
    cmds:
      - go build ./...

  test:
    dir: ../../..
    cmds:
      - go test -count=1 -race ./...

  vet:
    dir: ../../..
    cmds:
      - go vet ./...

  build-mlx:
    dir: ../../..
    cmds:
      - CGO_ENABLED=1 go build -tags mlx ./...

  build-stub:
    dir: ../../..
    cmds:
      - go build -tags nomlx ./...

  test-mlx:
    dir: ../../..
    cmds:
      - |
        if [ "$(go env GOOS)/$(go env GOARCH)" = "darwin/arm64" ]; then
          go test -tags mlx ./...
        else
          echo "skipping test-mlx: requires darwin/arm64"
        fi

  mlxlm-build:
    dir: ../../..
    cmds:
      - go build -tags "\"!nomlxlm\"" ./mlxlm/...

  cli:
    desc: "AX-10 CLI artifact tests — each lthn-mlx command in its own isolated process (no shared-globals pollution), assertions via jq/grep/exit-code (no python). Skips commands whose model isn't cached."
    cmds:
      - task -d discover test
      - task -d generate test
      - task -d state test
      - task -d serve test
      - task -d mtp test

  default:
    deps:
      - build
      - test
      - vet
