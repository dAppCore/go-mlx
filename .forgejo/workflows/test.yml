name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet
        working-directory: go
        run: GOWORK=off go vet ./...
      - name: Test coverage
        run: sh scripts/coverage.sh
      - name: Build (stub)
        working-directory: go
        run: GOWORK=off go build ./...
